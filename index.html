<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>CRT Oscilloscope</title>
<style>
    :root {
        --bg: #0d0f0d;
        --panel: #181b18;
        --line: #2c332c;
        --amber: #ffcc66;
        --k: 1;                              /* соотношение сторон экрана */
        --hb: 68dvh;                         /* высота, которую экран может занять */
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); }
    body {
        color: #dfe6df;
        font-family: system-ui, -apple-system, sans-serif;
        touch-action: manipulation;
        user-select: none; -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
    }
    .app {
        display: flex; flex-direction: column; gap: 10px;
        padding: 10px;
        padding-top: max(10px, env(safe-area-inset-top));
        padding-bottom: max(10px, env(safe-area-inset-bottom));
        padding-left: max(10px, env(safe-area-inset-left));
        padding-right: max(10px, env(safe-area-inset-right));
        max-width: 760px; margin: 0 auto;
    }
    .stage { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
    .screen {
        position: relative;
        width: min(100%, calc(var(--hb) * var(--k)));
        aspect-ratio: var(--k);
        background: #020403;
        border: 2px solid #2b352b;
        border-radius: 10px;
        box-shadow: inset 0 0 30px #000, 0 0 0 4px #0a0c0a;
        overflow: hidden;
    }
    .screen.yt { --k: 1.3333; }
    .screen canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #grid { pointer-events: none; }
    .overlay { position: absolute; top: 6px; right: 6px; display: flex; gap: 6px; z-index: 3; }
    .ibtn {
        width: 36px; height: 36px; border-radius: 8px;
        background: rgba(20,28,20,.55); color: #bfe8c6; border: 1px solid rgba(120,200,130,.25);
        display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer;
    }
    .ibtn:active { transform: scale(.94); }
    .status { font-size: 12px; color: #7d8d7d; text-align: center; min-height: 15px; }
    .panel {
        display: flex; flex-direction: column; gap: 12px;
        background: var(--panel); border: 1px solid var(--line);
        border-radius: 10px; padding: 14px; width: 100%;
    }
    .row { display: flex; gap: 8px; }
    .btn {
        flex: 1; background: #2a2f2a; color: #fff; border: 1px solid #4a524a;
        padding: 13px 6px; border-radius: 8px; font-size: 15px; font-weight: 600;
        text-align: center; cursor: pointer;
    }
    .btn.small { font-size: 13px; padding: 10px 6px; }
    .btn.active { background: var(--amber); color: #111; border-color: var(--amber); }
    .btn:active { transform: scale(.97); }
    .lang-row { justify-content: flex-end; }
    .lang-btn { flex: 0 0 54px; min-width: 54px; padding: 7px 8px; font-size: 12px; }
    .knob { display: flex; flex-direction: column; gap: 2px; }
    .knob label { color: var(--amber); font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; }
    .knob label span { color: #9aa59a; font-weight: 400; }
    input[type=range] { width: 100%; height: 28px; accent-color: var(--amber); margin: 0; cursor: pointer; }
    .knob select {
        width: 100%; min-height: 36px; padding: 7px 9px; border-radius: 7px;
        background: #2a2f2a; color: #dfe6df; border: 1px solid #4a524a;
        font: inherit; font-size: 13px; accent-color: var(--amber);
    }
    .hidden { display: none !important; }
    .app.nopanel .panel { display: none; }

    @media (orientation: portrait) { .screen { --hb: 66dvh; } .app.nopanel .screen { --hb: 90dvh; } }
    @media (orientation: landscape) {
        .app { max-width: none; flex-direction: row; height: 100dvh; align-items: stretch; margin: 0; }
        .stage { flex: 1 1 auto; justify-content: center; }
        .screen { --hb: calc(100dvh - 40px); }
        .panel { width: min(360px, 42vw); flex: 0 0 auto; overflow-y: auto; max-height: calc(100dvh - 20px); }
    }
</style>
</head>
<body>
<div class="app" id="app">
    <div class="stage">
        <div class="screen" id="screen">
            <canvas id="beam"></canvas>
            <canvas id="grid"></canvas>
            <div class="overlay">
                <div class="ibtn" id="fsBtn" title="Fullscreen">⛶</div>
                <div class="ibtn" id="panelBtn" title="Panel">☰</div>
            </div>
        </div>
        <div class="status" id="fps"></div>
        <div class="status" id="status">Load an audio file (WAV/FLAC recommended — lossless)</div>
    </div>

    <div class="panel" id="panel">
        <div class="row lang-row" id="languageRow" role="group" aria-label="Interface language">
            <button type="button" class="btn small lang-btn active" id="langEn" aria-pressed="true">EN</button>
            <button type="button" class="btn small lang-btn" id="langRu" aria-pressed="false">RU</button>
        </div>
        <div class="row">
            <label class="btn" for="audioFile" id="fileLabel" data-i18n="file">🎵 File</label>
            <input type="file" id="audioFile" accept="audio/*,.wav,.flac,.mp3,.ogg,.m4a" class="hidden">
            <div class="btn" id="micBtn">🎙 Microphone</div>
        </div>
        <div class="row">
            <div class="btn" id="playBtn">▶ Play</div>
            <div class="btn active" id="modeBtn">MODE: X-Y</div>
        </div>

        <div class="knob">
            <label data-i18n="position">POSITION <span id="timeLabel">0:00 / 0:00</span></label>
            <input type="range" id="seek" min="0" max="1000" step="1" value="0">
        </div>
        <div class="knob">
            <label data-i18n="volume">VOLUME</label>
            <input type="range" id="volKnob" min="0" max="1" step="0.01" value="0.8">
        </div>
        <div class="knob">
            <label data-i18n="sync">SYNC, ms <span id="syncVal"></span></label>
            <input type="range" id="syncKnob" min="-300" max="600" step="5" value="0">
        </div>
        <div class="knob">
            <label data-i18n="scale">SCALE (V/DIV) <span id="voltVal"></span></label>
            <input type="range" id="voltKnob" min="0.1" max="3" step="0.05" value="1">
        </div>
        <div class="knob">
            <label data-i18n="beamCurrent">BEAM CURRENT <span id="brightVal"></span></label>
            <input type="range" id="brightKnob" min="0.2" max="4" step="0.05" value="1">
        </div>
        <div class="knob">
            <label data-i18n="focus">FOCUS (beam width) <span id="focusVal"></span></label>
            <input type="range" id="focusKnob" min="0.3" max="2" step="0.05" value="0.6">
        </div>
        <div class="knob">
            <label data-i18n="blanking">BEAM BLANKING (Z-AXIS) <span id="blankVal"></span></label>
            <input type="range" id="blankKnob" min="0" max="1" step="0.05" value="0.95">
        </div>
        <div class="knob">
            <label data-i18n="threshold">TRANSITION DETECTION THRESHOLD <span id="zThresholdVal"></span></label>
            <input type="range" id="zThresholdKnob" min="1.5" max="4.5" step="0.1" value="2.2">
        </div>
        <div class="knob">
            <label data-i18n="persistence">PHOSPHOR PERSISTENCE, ms <span id="persistVal"></span></label>
            <input type="range" id="persistKnob" min="1" max="150" step="1" value="10">
        </div>
        <div class="knob">
            <label data-i18n="phosphorProfile">PHOSPHOR PROFILE (X-Y) <span id="phosphorVal">Standard</span></label>
            <select id="phosphorSelect">
                <option value="fast" data-i18n="phosphorFast">Fast — short trail</option>
                <option value="standard" selected data-i18n="phosphorStandard">Standard — balanced</option>
                <option value="dual" data-i18n="phosphorDual">Dual — pronounced tail</option>
                <option value="long" data-i18n="phosphorLong">Long — extended persistence</option>
            </select>
        </div>
        <div class="knob">
            <label data-i18n="glow">GLASS GLOW (GAUSSIAN) <span id="glowVal"></span></label>
            <input type="range" id="glowKnob" min="0" max="1.5" step="0.05" value="0.45">
        </div>
        <div class="knob" id="timeGroup">
            <label data-i18n="timeDiv">TIME/DIV (Y-T window, samples) <span id="timeVal"></span></label>
            <input type="range" id="timeKnob" min="256" max="8192" step="256" value="2048">
        </div>
        <div class="row">
            <div class="btn small active" id="autoBtn">AUTO BRIGHTNESS</div>
            <div class="btn small active" id="qualBtn">QUALITY: HIGH</div>
            <div class="btn small" id="curveBtn">TRACE: RAW</div>
        </div>
    </div>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);

const appEl = $('app'), screenEl = $('screen');
const beamCv = $('beam'), gridCv = $('grid');
const gctx = gridCv.getContext('2d');
const statusEl = $('status'), fpsEl = $('fps');
const fileInput = $('audioFile'), fileLabel = $('fileLabel');
const micBtn = $('micBtn'), playBtn = $('playBtn'), modeBtn = $('modeBtn');
const seekEl = $('seek'), timeLabel = $('timeLabel'), volKnob = $('volKnob');
const voltKnob = $('voltKnob'), brightKnob = $('brightKnob'), focusKnob = $('focusKnob'), blankKnob = $('blankKnob');
const zThresholdKnob = $('zThresholdKnob'), phosphorSelect = $('phosphorSelect');
const persistKnob = $('persistKnob'), glowKnob = $('glowKnob'), timeKnob = $('timeKnob');
const syncKnob = $('syncKnob');
const timeGroup = $('timeGroup'), autoBtn = $('autoBtn'), qualBtn = $('qualBtn'), curveBtn = $('curveBtn');
const langEnBtn = $('langEn'), langRuBtn = $('langRu'), languageRow = $('languageRow');

let isXY = true, autoBright = true, hiQuality = true, smoothPath = false;
const num = el => parseFloat(el.value);

const I18N = {
    en: {
        documentTitle: 'CRT Oscilloscope', language: 'Interface language',
        fullscreen: 'Fullscreen', panel: 'Panel',
        file: '🎵 File', mic: '🎙 Microphone', stop: '🛑 Stop', play: '▶ Play', pause: '⏸ Pause',
        position: 'POSITION', volume: 'VOLUME', sync: 'SYNC, ms', scale: 'SCALE (V/DIV)',
        beamCurrent: 'BEAM CURRENT', focus: 'FOCUS (beam width)', blanking: 'BEAM BLANKING (Z-AXIS)',
        threshold: 'TRANSITION DETECTION THRESHOLD', persistence: 'PHOSPHOR PERSISTENCE, ms',
        phosphorProfile: 'PHOSPHOR PROFILE (X-Y)', phosphorFast: 'Fast — short trail',
        phosphorStandard: 'Standard — balanced', phosphorDual: 'Dual — pronounced tail',
        phosphorLong: 'Long — extended persistence', glow: 'GLASS GLOW (GAUSSIAN)',
        timeDiv: 'TIME/DIV (Y-T window, samples)', autoBrightness: 'AUTO BRIGHTNESS',
        mode: xy => 'MODE: ' + (xy ? 'X-Y' : 'Y-T'),
        quality: high => 'QUALITY: ' + (high ? 'HIGH' : 'LOW'),
        curve: smooth => 'TRACE: ' + (smooth ? 'CATMULL' : 'RAW'),
        phosphorNames: { fast: 'Fast', standard: 'Standard', dual: 'Dual', long: 'Long' },
        batch: 'batch', dropped: 'dropped', cpu: 'CPU', gpu: 'GPU',
        status: {
            prompt: 'Load an audio file (WAV/FLAC recommended — lossless)',
            analyzing: 'Analyzing format and decoding…',
            loaded: p => {
                const rate = p.sourceRate
                    ? ' · source ' + p.sourceRate + ' Hz · analysis ' + p.sampleRate + ' Hz' + (p.resampled ? ' (resampled by browser)' : ' (no resampling)')
                    : ' · analysis ' + p.sampleRate + ' Hz (source rate unknown)';
                return p.fileName + rate + ' · output: audio-system resampling · ' + (p.stereo ? 'Stereo' : 'Mono (X = Y, diagonal trace)');
            },
            readError: 'Could not read the file',
            startError: 'Could not start the audio engine',
            microphone: 'Microphone',
            webgl: p => 'WebGL error: ' + p.message,
            hdr: 'HDR textures unavailable; using simplified 8-bit mode',
            glowFallback: 'Glow FBO unavailable; using sharp rendering without a halo'
        },
        readAlert: 'File read error. Try WAV, FLAC, or MP3.',
        micAlert: 'Microphone access denied or unavailable.'
    },
    ru: {
        documentTitle: 'CRT Oscilloscope', language: 'Язык интерфейса',
        fullscreen: 'Во весь экран', panel: 'Панель',
        file: '🎵 Файл', mic: '🎙 Микрофон', stop: '🛑 Стоп', play: '▶ Играть', pause: '⏸ Пауза',
        position: 'ПОЗИЦИЯ', volume: 'ГРОМКОСТЬ', sync: 'СИНХРОНИЗАЦИЯ, мс',
        scale: 'МАСШТАБ (V/DIV)', beamCurrent: 'ТОК ЛУЧА (BEAM CURRENT)',
        focus: 'ФОКУС (толщина луча)', blanking: 'ГАШЕНИЕ ЛУЧА (Z-AXIS)',
        threshold: 'ПОРОГ ОБНАРУЖЕНИЯ ПЕРЕХОДА', persistence: 'ПОСЛЕСВЕЧЕНИЕ, мс',
        phosphorProfile: 'ПРОФИЛЬ ЛЮМИНОФОРА (X-Y)', phosphorFast: 'Быстрый — короткий след',
        phosphorStandard: 'Стандартный — сбалансированный', phosphorDual: 'Двойной — выраженный хвост',
        phosphorLong: 'Длинный — длительное послесвечение', glow: 'СВЕЧЕНИЕ СТЕКЛА (GAUSSIAN)',
        timeDiv: 'TIME/DIV (окно Y-T, сэмплов)', autoBrightness: 'АВТО-ЯРКОСТЬ',
        mode: xy => 'РЕЖИМ: ' + (xy ? 'X-Y' : 'Y-T'),
        quality: high => 'КАЧЕСТВО: ' + (high ? 'ВЫСОКОЕ' : 'НИЗКОЕ'),
        curve: smooth => 'ТРАЕКТОРИЯ: ' + (smooth ? 'CATMULL' : 'RAW'),
        phosphorNames: { fast: 'Быстрый', standard: 'Стандартный', dual: 'Двойной', long: 'Длинный' },
        batch: 'пакет', dropped: 'потеряно', cpu: 'CPU', gpu: 'GPU',
        status: {
            prompt: 'Загрузите аудиофайл (лучше WAV/FLAC — без потерь)',
            analyzing: 'Анализирую формат и декодирую…',
            loaded: p => {
                const rate = p.sourceRate
                    ? ' · источник ' + p.sourceRate + ' Гц · анализ ' + p.sampleRate + ' Гц' + (p.resampled ? ' (пересчитан браузером)' : ' (без пересчёта)')
                    : ' · анализ ' + p.sampleRate + ' Гц (частота источника не определена)';
                return p.fileName + rate + ' · выход: ресемплинг аудиосистемой · ' + (p.stereo ? 'стерео' : 'моно (X = Y, будет диагональ)');
            },
            readError: 'Не удалось прочитать файл',
            startError: 'Не удалось запустить аудиодвижок',
            microphone: 'Микрофон',
            webgl: p => 'Ошибка WebGL: ' + p.message,
            hdr: 'HDR-текстуры недоступны, упрощённый режим (8 бит)',
            glowFallback: 'Glow FBO недоступен: используется резкий режим без ореола'
        },
        readAlert: 'Ошибка чтения. Попробуйте WAV, FLAC или MP3.',
        micAlert: 'Нет доступа к микрофону.'
    }
};

let language = (() => {
    try { return localStorage.getItem('scopeLanguage') === 'ru' ? 'ru' : 'en'; }
    catch (_) { return 'en'; }
})();
let statusKey = 'prompt', statusArgs = {};
const tr = (key, ...args) => {
    const value = I18N[language][key];
    return typeof value === 'function' ? value(...args) : value;
};
function setStatus(key, args = {}) {
    statusKey = key; statusArgs = args;
    const value = I18N[language].status[key];
    statusEl.textContent = typeof value === 'function' ? value(args) : value;
}
function updatePhosphorName() {
    $('phosphorVal').textContent = I18N[language].phosphorNames[phosphorSelect.value] || I18N[language].phosphorNames.standard;
}
function applyLanguage() {
    document.documentElement.lang = language;
    document.title = tr('documentTitle');
    document.querySelectorAll('[data-i18n]').forEach(el => {
        const value = tr(el.getAttribute('data-i18n'));
        const textNode = Array.from(el.childNodes).find(node => node.nodeType === Node.TEXT_NODE);
        if (textNode) textNode.nodeValue = value + (el.tagName === 'LABEL' && el.querySelector('span') ? ' ' : '');
    });
    $('fsBtn').title = tr('fullscreen');
    $('panelBtn').title = tr('panel');
    languageRow.setAttribute('aria-label', tr('language'));
    langEnBtn.classList.toggle('active', language === 'en');
    langRuBtn.classList.toggle('active', language === 'ru');
    langEnBtn.setAttribute('aria-pressed', String(language === 'en'));
    langRuBtn.setAttribute('aria-pressed', String(language === 'ru'));
    setStatus(statusKey, statusArgs);
    setPlayUI(); setMicUI(); setModeUI(); setAutoUI(); setQualityUI(); setCurveUI(); updatePhosphorName();
}
function setLanguage(next) {
    if (!I18N[next] || next === language) return;
    language = next;
    try { localStorage.setItem('scopeLanguage', language); } catch (_) {}
    applyLanguage();
}
langEnBtn.addEventListener('click', () => setLanguage('en'));
langRuBtn.addEventListener('click', () => setLanguage('ru'));


// ───────────────────────── Аудио ─────────────────────────
let audioCtx = null, gainNode = null, splitter = null, anL = null, anR = null;
let buf = null, chL = null, chR = null, sr = 44100, dur = 0, fileName = '';
let src = null, playing = false, startCtx = 0, startOff = 0, pausedOff = 0, lastAbs = 0;
let mic = false, micStream = null, micSrc = null;
let carryOK = false;                       // непрерывность луча между кадрами
let detectedSourceRate = null;
let contextRequestedRate = null;
let fileLoadSerial = 0;

// Анализируем файл в его собственной частоте дискретизации. AudioContext
// выдаёт буфер в source rate, а аудиосистема браузера пересчитывает звук
// отдельно под физический аудиовыход при воспроизведении.
// Это сохраняет геометрию исходного сигнала для XY-трассы.
function detectSourceSampleRate(buffer) {
    const b = new Uint8Array(buffer);
    const n = b.length;
    const ascii = (i, text) => {
        if (i < 0 || i + text.length > n) return false;
        for (let k = 0; k < text.length; k++) if (b[i + k] !== text.charCodeAt(k)) return false;
        return true;
    };
    const u32le = i => i + 4 <= n ? (b[i] | (b[i+1] << 8) | (b[i+2] << 16) | (b[i+3] << 24)) >>> 0 : 0;
    const u32be = i => i + 4 <= n ? ((b[i] << 24) | (b[i+1] << 16) | (b[i+2] << 8) | b[i+3]) >>> 0 : 0;

    // RIFF/WAVE: sampleRate находится в fmt chunk, смещение +4 от начала данных.
    if (ascii(0, 'RIFF') && ascii(8, 'WAVE')) {
        let p = 12;
        while (p + 8 <= n) {
            const size = u32le(p + 4), data = p + 8;
            if (ascii(p, 'fmt ') && size >= 16 && data + 16 <= n) return u32le(data + 4) || null;
            if (size > n || data + size > n) break;
            p = data + size + (size & 1);
        }
    }

    // FLAC STREAMINFO: частота — старшие 20 бит поля sampleRate/channels/bps.
    if (ascii(0, 'fLaC') && n >= 42) {
        const data = 8;
        if ((b[4] & 0x7f) === 0 && ((b[5] << 16) | (b[6] << 8) | b[7]) >= 34) {
            const rate = (b[data + 10] << 12) | (b[data + 11] << 4) | (b[data + 12] >>> 4);
            if (rate >= 8000 && rate <= 384000) return rate;
        }
    }

    // Ogg Vorbis identification header; Opus всегда декодируется в 48 kHz.
    const scanLimit = Math.min(n - 16, 1_000_000);
    for (let i = 0; i < scanLimit; i++) {
        if (ascii(i, 'OpusHead')) return 48000;
        if (b[i] === 1 && ascii(i + 1, 'vorbis')) {
            const rate = u32le(i + 12);
            if (rate >= 8000 && rate <= 384000) return rate;
        }
    }

    // MP3: находим первый валидный MPEG audio frame (с учётом ID3v2).
    let mp3Start = 0;
    if (ascii(0, 'ID3') && n >= 10) {
        const tagSize = ((b[6] & 0x7f) << 21) | ((b[7] & 0x7f) << 14) | ((b[8] & 0x7f) << 7) | (b[9] & 0x7f);
        mp3Start = Math.min(n, 10 + tagSize + ((b[5] & 0x10) ? 10 : 0));
    }
    const mp3Rates = [44100, 48000, 32000];
    for (let i = mp3Start; i < Math.min(n - 4, mp3Start + 65536); i++) {
        const h = u32be(i);
        if (((h & 0xffe00000) >>> 0) !== 0xffe00000) continue;
        const version = (h >>> 19) & 3, layer = (h >>> 17) & 3, idx = (h >>> 10) & 3;
        if (version === 1 || layer === 0 || idx === 3) continue;
        const base = mp3Rates[idx];
        const rate = version === 3 ? base : version === 2 ? base / 2 : base / 4;
        if (rate >= 8000) return rate;
    }

    // MP4/M4A AudioSampleEntry (mp4a): samplerate — 16.16 fixed-point.
    for (let i = 4; i < scanLimit; i++) {
        if (!ascii(i, 'mp4a')) continue;
        const fixed = u32be(i + 28);
        const rate = fixed >>> 16;
        if (rate >= 8000 && rate <= 192000) return rate;
    }
    return null;
}

let MAX_N = 4000;
let sx = new Float32Array(16384), sy = new Float32Array(16384);
const tmpL = new Float32Array(4096), tmpR = new Float32Array(4096);
let QX = new Float32Array(MAX_N + 4), QY = new Float32Array(MAX_N + 4);
function resizeSampleBuffers(sampleRate) {
    // Поддерживаем окно до 50 мс без потери сэмплов даже при 96/192 kHz.
    MAX_N = Math.max(4000, Math.min(32768, Math.ceil(sampleRate * 0.05) + 8));
    sx = new Float32Array(Math.max(MAX_N, 16384));
    sy = new Float32Array(Math.max(MAX_N, 16384));
    QX = new Float32Array(MAX_N + 4);
    QY = new Float32Array(MAX_N + 4);
}

function initAudio(requestedRate = null) {
    if (audioCtx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    const options = { latencyHint: 'playback' };
    if (requestedRate && Number.isFinite(requestedRate)) options.sampleRate = requestedRate;
    try { audioCtx = new AC(options); }
    catch (_) { audioCtx = new AC({ latencyHint: 'playback' }); }
    contextRequestedRate = requestedRate || null;
    gainNode = audioCtx.createGain();
    gainNode.gain.value = num(volKnob);
    gainNode.connect(audioCtx.destination);
    splitter = audioCtx.createChannelSplitter(2);
    anL = audioCtx.createAnalyser(); anR = audioCtx.createAnalyser();
    anL.fftSize = 4096; anR.fftSize = 4096;

    for (let j = 1; j < rows; j++) { const y = Math.round(H * j / rows) + 0.5; gctx.moveTo(0, y); gctx.lineTo(W, y); }

        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        accFbo = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, accFbo);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, accTex, 0);
        if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE) break;
        // HDR недоступен — падаем на 8 бит
        gl.deleteTexture(accTex); gl.deleteFramebuffer(accFbo);
        floatOK = false;
    }
    accScale = floatOK ? 1 : 0.2;
    TW = w; TH = h;
    gl.viewport(0, 0, w, h);
    gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    if (!floatOK) setStatus('hdr');
    allocGlow(Math.max(1, Math.ceil(w / 2)), Math.max(1, Math.ceil(h / 2)));
}

function allocGlow(w, h) {
    for (const t of [glowTexA, glowTexB]) if (t) gl.deleteTexture(t);
    for (const f of [glowFboA, glowFboB]) if (f) gl.deleteFramebuffer(f);
    glowTexA = glowTexB = glowFboA = glowFboB = null;
    glowAvailable = false;
    GW = w; GH = h;
    const internal = floatOK ? gl.RGBA16F : gl.RGBA8;
    function makeTarget() {
        const tex = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, tex);
        gl.texStorage2D(gl.TEXTURE_2D, 1, internal, w, h);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        const fbo = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
        if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) {
            gl.deleteTexture(tex); gl.deleteFramebuffer(fbo); return null;
        }
        return { tex, fbo };
    }
    const a = makeTarget(), b = makeTarget();
    if (a && b) {
        glowTexA = a.tex; glowFboA = a.fbo;
        glowTexB = b.tex; glowFboB = b.fbo;
        glowAvailable = true;
    } else {
        if (a) { gl.deleteTexture(a.tex); gl.deleteFramebuffer(a.fbo); }
        if (b) { gl.deleteTexture(b.tex); gl.deleteFramebuffer(b.fbo); }
        setStatus('glowFallback');
    }
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}

// ───────────────────────── Сэмплы ─────────────────────────
function copyFile(startIdx, len) {
    const N = chL.length;
    let j = ((startIdx % N) + N) % N;
    for (let i = 0; i < len; i++) { sx[i] = chL[j]; sy[i] = chR[j]; if (++j === N) j = 0; }
}

function fetchXY(dt) {
    if (mic) {
        anL.getFloatTimeDomainData(tmpL); anR.getFloatTimeDomainData(tmpR);
        const n = Math.min(Math.max(8, Math.round(sr * dt)), MAX_N, 4096);
        const off = 4096 - n;
        for (let i = 0; i < n; i++) { sx[i] = tmpL[off + i]; sy[i] = tmpR[off + i]; }
        return n;
    }
    if (buf && playing) {
        const cur = Math.floor(posUnwrapped() * sr);
        let n = cur - lastAbs;
        if (n < 0) { lastAbs = cur; n = 0; carryOK = false; }
        const maxN = Math.min(Math.floor(sr * 0.05), MAX_N - 8);
        if (n > maxN) { lastAbs = cur - maxN; n = maxN; carryOK = false; }
        if (n > 0) copyFile(lastAbs + 1, n);
        lastAbs = cur;
        return n;
    }
    return 0;
}

// ───────────────────────── Кадр ─────────────────────────
const SQ2PI = 2.5066283;
let lastNX = 0, lastNY = 0;                  // последняя позиция луча
let LmeanS = 3;                              // сглаженная средняя длина шага луча (px/сэмпл)
const carryX = new Float32Array(3), carryY = new Float32Array(3);


function addInst(x0, y0, x1, y1, eFast, eMid, eSlow = 0) {
    if (!ensureInstCapacity(ni + 1)) { droppedInstances++; return; }
    const o = ni * IF;
    inst[o] = x0; inst[o+1] = y0; inst[o+2] = x1; inst[o+3] = y1;
    inst[o+4] = eFast; inst[o+5] = eMid; inst[o+6] = eSlow;
    ni++;
}

function fadeAcc(kFast, kMid, kSlow) {
    gl.useProgram(progFade);
    gl.bindVertexArray(vaoQuad);
    gl.blendColor(kFast, kMid, kSlow, 1);
    gl.blendFunc(gl.ZERO, gl.CONSTANT_COLOR);          // RGB *= (kFast, kMid, kSlow)
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

function drawBeam(sigma) {
    if (!ni) return;
    if (ni > peakBatchInstances) peakBatchInstances = ni;
    gl.useProgram(progBeam);
    gl.uniform2f(U.b_u_res, W, H);
    gl.uniform1f(U.b_u_sigma, sigma);
    gl.uniform1f(U.b_u_scale, accScale);
    gl.blendFunc(gl.ONE, gl.ONE);
    gl.bindVertexArray(vaoBeam);
    gl.bindBuffer(gl.ARRAY_BUFFER, bufInst);
    gl.bufferData(gl.ARRAY_BUFFER, inst.subarray(0, ni * IF), gl.STREAM_DRAW);
    gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, ni);
    ni = 0;
}

function runGlowPass(program, targetFbo, sourceTex, setUniforms) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, targetFbo);
    gl.viewport(0, 0, GW, GH);
    gl.disable(gl.BLEND);
    gl.useProgram(program);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, sourceTex);
    if (setUniforms) setUniforms();
    gl.bindVertexArray(vaoQuad);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

function present(mode, glow, expo) {
    const useGlow = glow > 0 && hiQuality && glowAvailable;
    if (useGlow) {
        // 1) интегрированное уменьшение яркостного поля;
        // 2) горизонтальный Gaussian;
        // 3) вертикальный Gaussian.
        runGlowPass(progGlowDown, glowFboA, accTex, () => {
            gl.uniform1i(U.gdown_src, 0);
            gl.uniform2f(U.gdown_texel, 1 / TW, 1 / TH);
        });
        runGlowPass(progGlowBlur, glowFboB, glowTexA, () => {
            gl.uniform1i(U.gblur_src, 0);
            gl.uniform2f(U.gblur_step, 1 / GW, 0);
        });
        runGlowPass(progGlowBlur, glowFboA, glowTexB, () => {
            gl.uniform1i(U.gblur_src, 0);
            gl.uniform2f(U.gblur_step, 0, 1 / GH);
        });
    }

    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, CW, CH);
    gl.disable(gl.BLEND);
    gl.useProgram(progDisp);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, accTex);
    gl.uniform1i(U.d_u_acc, 0);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, useGlow ? glowTexA : accTex);
    gl.uniform1i(U.d_u_glowTex, 1);
    gl.uniform1f(U.d_u_scale, accScale);
    gl.uniform1f(U.d_u_glow, useGlow ? glow : 0);
    gl.uniform1f(U.d_u_expo, expo);
    gl.uniform1i(U.d_u_mode, mode);
    gl.bindVertexArray(vaoQuad);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    gl.activeTexture(gl.TEXTURE0);
}

// Три временные компоненты имитации люминофора: быстрая, средняя и медленная.
// Пресеты художественные, а не паспортные кривые конкретных марок люминофора.
// Сумма весов примерно постоянна, поэтому профили в первую очередь меняют форму хвоста.
const PHOSPHOR_PROFILES = {
    fast:     { fast: 1.08, mid: 0.06, slow: 0.00, midMul: 1.8, midAdd: 0.003, slowMul: 4.0,  slowAdd: 0.010 },
    standard: { fast: 1.00, mid: 0.12, slow: 0.02, midMul: 2.5, midAdd: 0.006, slowMul: 8.0,  slowAdd: 0.025 },
    dual:     { fast: 0.95, mid: 0.14, slow: 0.05, midMul: 4.0, midAdd: 0.010, slowMul: 14.0, slowAdd: 0.060 },
    long:     { fast: 0.86, mid: 0.18, slow: 0.10, midMul: 6.0, midAdd: 0.015, slowMul: 22.0, slowAdd: 0.080 }
};

// Вынесено из цикла сегментов: не создаём новую функцию на каждой точке.
function normalizedDirectionDot(ax, ay, bx, by) {
    const al = Math.hypot(ax, ay), bl = Math.hypot(bx, by);
    return al > 0.05 && bl > 0.05 ? Math.max(-1, Math.min(1, (ax * bx + ay * by) / (al * bl))) : 1;
}

function frameXY(dt) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, accFbo);
    gl.viewport(0, 0, TW, TH);
    gl.enable(gl.BLEND);
    if (needClear) { gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT); needClear = false; }

    const phosphor = PHOSPHOR_PROFILES[phosphorSelect.value] || PHOSPHOR_PROFILES.standard;
    const tauF = num(persistKnob) / 1000;
    const tauM = tauF * phosphor.midMul + phosphor.midAdd;
    const tauS = tauF * phosphor.slowMul + phosphor.slowAdd;
    fadeAcc(Math.exp(-dt / tauF), Math.exp(-dt / tauM), Math.exp(-dt / tauS));

    const n = fetchXY(dt);
    const sigma = num(focusKnob);
    const cx = W / 2, cy = H / 2, sc = Math.min(W, H) / 2 * 0.92 * num(voltKnob);
    const Lt = 1.1 * num(brightKnob);                  // энергия электронного луча (beam current)

    if (n > 0) {
        if (!carryOK) { carryX.fill(sx[0]); carryY.fill(sy[0]); carryOK = true; }
        const len = n + 3;
        for (let i = 0; i < 3; i++) { QX[i] = cx + carryX[i] * sc; QY[i] = cy - carryY[i] * sc; }
        for (let i = 0; i < n; i++) { QX[3 + i] = cx + sx[i] * sc; QY[3 + i] = cy - sy[i] * sc; }
        // новая история: последние 3 точки (в нормированных координатах)
        const c0 = len - 3;
        for (let i = 0; i < 3; i++) {
            const k = c0 + i;
            carryX[i] = (QX[k] - cx) / sc; carryY[i] = (cy - QY[k]) / sc;
        }
        lastNX = carryX[2]; lastNY = carryY[2];

        // RAW рисует только новые интервалы: им не нужен look-ahead и повторное
        // наложение двух старых сегментов. Catmull требует историю и опережающую точку.
        const firstSegment = smoothPath ? 1 : 2;
        const lastSegment = smoothPath ? len - 3 : len - 2;

        // Средняя длина шага для автояркости.
        let sum = 0, cnt = 0;
        for (let j = firstSegment; j <= lastSegment; j++) {
            const dx = QX[j+1] - QX[j], dy = QY[j+1] - QY[j];
            sum += Math.min(Math.sqrt(dx*dx + dy*dy), 30); cnt++;
        }
        if (cnt) {
            const target = autoBright ? sum / cnt : 3;
            LmeanS += (target - LmeanS) * (1 - Math.exp(-dt / 0.3));
        }
        const Eunit = Lt * sigma * SQ2PI * Math.min(Math.max(LmeanS, 0.3), 40);

        for (let j = firstSegment; j <= lastSegment; j++) {
            const x1 = QX[j], y1 = QY[j], x2 = QX[j+1], y2 = QY[j+1];
            const dx = x2 - x1, dy = y2 - y1;
            const L = Math.sqrt(dx*dx + dy*dy);
            // Не обрезаем быстрые перемещения жёстким порогом: формула C = g·along/L
            // сама уменьшает энергию на единицу длины для быстрого пролёта.
            const stationary = L < 0.05 ? 0.03 : 1;     // «защита» от выжигания точки
            // Z-axis blanking: отдельного Z-сигнала в стереофайле нет, поэтому
            // переходы оцениваются по скорости и локальному нарушению направления.
            // Большой сегмент на плавном участке получает меньше дополнительного
            // штрафа, а скачок между разными частями фигуры — больше.
            const speedRatio = L / Math.max(LmeanS, 0.3);
            let dotSum = 0, dotCount = 0;
            if (j > firstSegment) {
                dotSum += normalizedDirectionDot(x1 - QX[j-1], y1 - QY[j-1], dx, dy);
                dotCount++;
            }
            if (j < lastSegment) {
                dotSum += normalizedDirectionDot(dx, dy, QX[j+2] - x2, QY[j+2] - y2);
                dotCount++;
            }
            const meanDirection = dotCount ? dotSum / dotCount : 1;
            const directionBreak = Math.max(0, Math.min(1, (0.35 - meanDirection) / 1.35));
            const jumpScore = speedRatio * (1 + 0.35 * directionBreak);
            const zStart = num(zThresholdKnob);
            const zEnd = Math.max(5.0, zStart + 0.5);
            const gateT = Math.max(0, Math.min(1, (jumpScore - zStart) / (zEnd - zStart)));
            const gate = gateT * gateT * (3 - 2 * gateT); // smoothstep: без резкого щелчка яркости
            const transitionGain = 1 - num(blankKnob) * gate;
            let Us = 1, spline = false;
            if (smoothPath && L > 4 && L < 60) {
                const x0 = QX[j-1], y0 = QY[j-1], x3 = QX[j+2], y3 = QY[j+2];
                const a = Math.abs(x1 - x0) + Math.abs(y1 - y0), b = Math.abs(x3 - x2) + Math.abs(y3 - y2);
                if (a < 60 && b < 60) { spline = true; Us = Math.min(6, Math.ceil(L / 5)); }
            }
            const E = Eunit * stationary * transitionGain / Us;
            if (!spline) {
                const age = (len - 1 - (j + 0.5)) / sr;
                addInst(x1, y1, x2, y2,
                    E * phosphor.fast * Math.exp(-age / tauF),
                    E * phosphor.mid * Math.exp(-age / tauM),
                    E * phosphor.slow * Math.exp(-age / tauS));
            } else {
                const x0 = QX[j-1], y0 = QY[j-1], x3 = QX[j+2], y3 = QY[j+2];
                let px = x1, py = y1;
                for (let k = 1; k <= Us; k++) {
                    const u = k / Us, u2 = u * u, u3 = u2 * u;
                    const qx = 0.5 * (2*x1 + (-x0 + x2)*u + (2*x0 - 5*x1 + 4*x2 - x3)*u2 + (-x0 + 3*x1 - 3*x2 + x3)*u3);
                    const qy = 0.5 * (2*y1 + (-y0 + y2)*u + (2*y0 - 5*y1 + 4*y2 - y3)*u2 + (-y0 + 3*y1 - 3*y2 + y3)*u3);
                    const age = (len - 1 - (j + (k - 0.5) / Us)) / sr;
                    addInst(px, py, qx, qy,
                        E * phosphor.fast * Math.exp(-age / tauF),
                        E * phosphor.mid * Math.exp(-age / tauM),
                        E * phosphor.slow * Math.exp(-age / tauS));
                    px = qx; py = qy;
                }
            }
        }
    } else if (!playing && !mic) {
        // луч стоит на месте — яркая точка, равновесная яркость не зависит от FPS
        const Edot = 2 * (2 * Math.PI * sigma * sigma) * (1 - Math.exp(-dt / tauF)) * Math.max(0.3, num(brightKnob));
        const px = cx + lastNX * sc, py = cy - lastNY * sc;
        addInst(px, py, px, py, Edot * phosphor.fast, Edot * phosphor.mid, Edot * phosphor.slow);
    }
    drawBeam(sigma);
    present(0, num(glowKnob), 1.0);
}

function frameYT() {
    gl.bindFramebuffer(gl.FRAMEBUFFER, accFbo);
    gl.viewport(0, 0, TW, TH);
    gl.disable(gl.BLEND);
    gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.enable(gl.BLEND);

    let tw = parseInt(timeKnob.value, 10), winL = null, winR = null;
    if (mic) {
        tw = Math.min(tw, 2048);
        anL.getFloatTimeDomainData(tmpL); anR.getFloatTimeDomainData(tmpR);
        winL = tmpL.subarray(4096 - 2 * tw); winR = tmpR.subarray(4096 - 2 * tw);
    } else if (buf) {
        const end = Math.floor(posUnwrapped() * sr);
        copyFile(end - 2 * tw, 2 * tw);
        winL = sx; winR = sy;
    }
    const sigma = num(focusKnob);
    const cy = H / 2, sc = (H / 2 - 10) * num(voltKnob);
    const Lt = 1.3 * num(brightKnob);
    const k = Lt * sigma * SQ2PI;

    if (!winL) {
        addInst(0, cy, W, cy, k * W, 0);                // нет сигнала — линия по центру
    } else {
        let start = 0;                                   // триггер: L пересекает ноль вверх
        for (let i = 1; i < tw; i++) if (winL[i-1] < 0 && winL[i] >= 0) { start = i; break; }
        const pts = Math.max(2, Math.min(tw, Math.floor(W * 1.5), 1600));
        const step = tw / pts;
        for (let ch = 0; ch < 2; ch++) {
            const data = ch === 0 ? winL : winR;
            let x0 = 0, y0 = cy - (data[start] || 0) * sc;
            for (let i = 1; i < pts; i++) {
                const v = data[start + Math.floor(i * step)] || 0;
                const x = (i / (pts - 1)) * W, y = cy - v * sc;
                const dx = x - x0, dy = y - y0, E = k * Math.max(Math.sqrt(dx*dx + dy*dy), 0.05);
                addInst(x0, y0, x, y, ch === 0 ? E : 0, ch === 0 ? 0 : E);
                x0 = x; y0 = y;
            }
        }
    }
    drawBeam(sigma);
    present(1, num(glowKnob) * 0.6, 1.0);
}

// ───────────────────────── GPU timing (асинхронно, без readback-блокировок) ─────────────────────────
const timerExt = gl.getExtension('EXT_disjoint_timer_query_webgl2');
const pendingGpuQueries = [];
let gpuMs = null;
function beginGpuTimer() {
    if (!timerExt) return null;
    const q = gl.createQuery();
    if (!q) return null;
    gl.beginQuery(timerExt.TIME_ELAPSED_EXT, q);
    return q;
}
function endGpuTimer(q) {
    if (!q || !timerExt) return;
    gl.endQuery(timerExt.TIME_ELAPSED_EXT);
    pendingGpuQueries.push(q);
    if (pendingGpuQueries.length > 8) {
        gl.deleteQuery(pendingGpuQueries.shift());
    }
}
function pollGpuTimer() {
    if (!timerExt) return;
    const disjoint = gl.getParameter(timerExt.GPU_DISJOINT_EXT);
    while (pendingGpuQueries.length) {
        const q = pendingGpuQueries[0];
        if (!gl.getQueryParameter(q, gl.QUERY_RESULT_AVAILABLE)) break;
        pendingGpuQueries.shift();
        if (!disjoint) gpuMs = gl.getQueryParameter(q, gl.QUERY_RESULT) / 1e6;
        gl.deleteQuery(q);
    }
}

// ───────────────────────── Главный цикл ─────────────────────────
let lastT = performance.now(), lastUI = 0, fpsT = performance.now(), frames = 0;
let cpuMs = 0;
let lastDroppedInstances = 0;
function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(Math.max((now - lastT) / 1000, 0.001), 0.1);
    lastT = now;
    updateClock();
    if (!W || !glOK || !accTex) return;

    const cpuStart = performance.now();
    const gpuQuery = beginGpuTimer();
    if (isXY) frameXY(dt); else frameYT();
    endGpuTimer(gpuQuery);
    cpuMs = performance.now() - cpuStart;
    pollGpuTimer();

    frames++;
    if (now - fpsT > 500) {
        const span = now - fpsT;
        const droppedPerSec = Math.round((droppedInstances - lastDroppedInstances) * 1000 / span);
        fpsEl.textContent = Math.round(frames * 1000 / span) + ' fps · ' + CW + '×' + CH
            + ' · ' + tr('batch') + ' ' + peakBatchInstances + '/' + instanceCapacity
            + ' · ' + tr('dropped') + ' ' + droppedPerSec + '/s'
            + ' · ' + tr('cpu') + ' ' + cpuMs.toFixed(1) + ' ms'
            + (gpuMs === null ? '' : ' · ' + tr('gpu') + ' ' + gpuMs.toFixed(1) + ' ms');
        frames = 0;
        fpsT = now;
        lastDroppedInstances = droppedInstances;
        peakBatchInstances = 0;
    }
    if (buf && now - lastUI > 200) {
        lastUI = now;
        if (!seeking) {
            const p = wrap(posUnwrapped());
            seekEl.value = Math.round(p / dur * 1000);
            timeLabel.textContent = fmt(p) + ' / ' + fmt(dur);
        }
    }
}
document.addEventListener('visibilitychange', () => {
    if (!document.hidden && buf && playing) {
        lastAbs = Math.floor(posUnwrapped() * sr); carryOK = false;
        if (audioCtx.state !== 'running') audioCtx.resume();
    }
});

try { glOK = initGL(); } catch (e) { setStatus('webgl', { message: e.message }); console.error(e); }
resize();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
